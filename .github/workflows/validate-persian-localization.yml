name: Validate Persian localization

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  validate-and-deploy:
    if: github.event.issue.title == 'Validate Persian localization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run Django validation
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,team.smarbiz.sbs
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python manage.py makemigrations --check
          python manage.py check
          python manage.py test
          python manage.py collectstatic --noinput

      - name: Deploy production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            cd /opt/theteam
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env
            docker compose up -d --build --remove-orphans
            docker image prune -f
            for attempt in $(seq 1 40); do
              if docker compose exec -T web curl -fsS http://127.0.0.1:8000/health/ >/dev/null; then
                docker compose ps
                exit 0
              fi
              sleep 5
            done
            docker compose logs --tail=250
            exit 1

      - name: Verify public HTTPS
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 20 https://team.smarbiz.sbs/health/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Persian localization validation finished with **${{ job.status }}**. Run ID: \`${context.runId}\`.`,
            });
