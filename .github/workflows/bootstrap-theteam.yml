name: Apply The Team branding layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-theteam.yml"

permissions:
  contents: write

concurrency:
  group: theteam-branding-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified branding patch
        shell: bash
        run: |
          set -euo pipefail
          cat .theteam-patch/part* | base64 --decode > /tmp/theteam-branding-patch.tar.gz
          echo "e3f2cb3babf61cf66b0f889cdb12ed5758a33330c8933cb3dc0b6f8a82c12171  /tmp/theteam-branding-patch.tar.gz" | sha256sum -c -
          tar -tzf /tmp/theteam-branding-patch.tar.gz >/dev/null
          tar -xzf /tmp/theteam-branding-patch.tar.gz -C .
          rm -rf .theteam-patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate application
        shell: bash
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,team.smarbiz.sbs
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python manage.py makemigrations --check
          python manage.py check
          python manage.py test
          python manage.py collectstatic --noinput

      - name: Publish branding layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable multilingual team identity"
          git push origin main
