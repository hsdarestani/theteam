name: Bootstrap The Team from Eintracht

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-theteam.yml"

permissions:
  contents: write

concurrency:
  group: theteam-bootstrap
  cancel-in-progress: false

jobs:
  mirror-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror Eintracht application source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hsdarestani/eintracht.git /tmp/eintracht

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/eintracht/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Destination already mirrors the upstream source."
            exit 0
          fi

          git commit -m "Mirror Eintracht application source"
          git push origin main
