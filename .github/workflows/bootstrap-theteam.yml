name: Deploy The Team

on:
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: theteam-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    if: github.event_name != 'issues' || github.event.issue.title == 'Deploy The Team production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate Django application
        id: validate
        continue-on-error: true
        shell: bash
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,team.smarbiz.sbs
        run: |
          set -o pipefail
          {
            set -euo pipefail
            pip install -r requirements.txt
            python manage.py makemigrations --check
            python manage.py check
            python manage.py test
            python manage.py collectstatic --noinput
          } 2>&1 | tee /tmp/theteam-validation.log

      - name: Publish validation error
        if: always() && steps.validate.outcome == 'failure' && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/theteam-validation.log';
            const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Validation log was not created.';
            const tail = raw.slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Django validation failed:\n\n\`\`\`text\n${tail}\n\`\`\``,
            });

      - name: Deploy via SSH
        id: deploy
        if: steps.validate.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive

            if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v openssl >/dev/null 2>&1; then
              apt-get update
              apt-get install -y git curl openssl ca-certificates
            fi

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi

            if ! docker compose version >/dev/null 2>&1; then
              apt-get update
              apt-get install -y docker-compose-plugin
            fi

            if [ ! -d /opt/theteam/.git ]; then
              rm -rf /opt/theteam
              git clone https://github.com/hsdarestani/theteam.git /opt/theteam
            else
              cd /opt/theteam
              git fetch origin main
              git reset --hard origin/main
              git clean -fd -e .env
            fi

            cd /opt/theteam

            if [ ! -f .env ]; then
              SECRET=$(openssl rand -hex 48)
              DBPASS=$(openssl rand -hex 32)
              cat > .env <<ENVFILE
            DJANGO_SECRET_KEY=$SECRET
            POSTGRES_DB=teamboard
            POSTGRES_USER=teamboard
            POSTGRES_PASSWORD=$DBPASS
            DJANGO_ALLOWED_HOSTS=team.smarbiz.sbs,5.75.203.165,localhost,127.0.0.1
            CSRF_TRUSTED_ORIGINS=https://team.smarbiz.sbs
            ENVFILE
              chmod 600 .env
            fi

            docker compose up -d --build --remove-orphans
            docker image prune -f

            for attempt in $(seq 1 40); do
              if docker compose exec -T web curl -fsS http://127.0.0.1:8000/health/ >/dev/null; then
                echo "Application health check passed."
                docker compose ps
                exit 0
              fi
              sleep 5
            done

            echo "Application did not become healthy in time."
            docker compose ps
            docker compose logs --tail=250
            exit 1

      - name: Verify public HTTPS endpoint
        id: public
        if: steps.validate.outcome == 'success' && steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if response=$(curl -fsS --connect-timeout 10 --max-time 20 https://team.smarbiz.sbs/health/); then
              echo "$response"
              exit 0
            fi
            sleep 5
          done
          echo "The public HTTPS health endpoint did not become reachable."
          exit 1

      - name: Publish workflow result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const validation = '${{ steps.validate.outcome }}';
            const deployment = '${{ steps.deploy.outcome }}';
            const publicEndpoint = '${{ steps.public.outcome }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const succeeded = validation === 'success' && deployment === 'success' && publicEndpoint === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Workflow **${succeeded ? 'success' : 'failure'}**. Validation: \`${validation}\`. Deployment: \`${deployment}\`. Public HTTPS: \`${publicEndpoint}\`.\n\nRun ID: \`${runId}\`\n\n${runUrl}`,
            });

      - name: Fail incomplete deployment
        if: steps.validate.outcome == 'failure' || steps.public.outcome == 'failure'
        run: exit 1
