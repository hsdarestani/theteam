name: Apply Persian localization

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-test-deploy:
    if: github.event.issue.title == 'Apply Persian localization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect complete Persian translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          branding = Path('core/branding.py')
          text = branding.read_text()
          if 'from .persian_translations import PERSIAN_TRANSLATIONS' not in text:
              text = text.replace(
                  'from collections.abc import Mapping\n',
                  'from collections.abc import Mapping\n\nfrom .persian_translations import PERSIAN_TRANSLATIONS\n',
              )
          if 'PHRASE_TRANSLATIONS.setdefault("fa", {}).update(PERSIAN_TRANSLATIONS)' not in text:
              text = text.replace(
                  '\nRTL_LANGUAGES = {"ar", "fa", "he", "ur"}\n',
                  '\nPHRASE_TRANSLATIONS.setdefault("fa", {}).update(PERSIAN_TRANSLATIONS)\n\nRTL_LANGUAGES = {"ar", "fa", "he", "ur"}\n',
              )
          branding.write_text(text)

          tests = Path('core/test_branding.py')
          text = tests.read_text()
          if 'from django.core.management import call_command' not in text:
              text = text.replace(
                  'from django.core.files.uploadedfile import SimpleUploadedFile\n',
                  'from django.core.files.uploadedfile import SimpleUploadedFile\nfrom django.core.management import call_command\n',
              )
          if 'from django.utils import timezone' not in text:
              text = text.replace(
                  'from django.urls import reverse\n',
                  'from django.urls import reverse\nfrom django.utils import timezone\n',
              )
          if 'from .models import TeamEvent' not in text:
              text = text.replace(
                  'from .identity_models import TeamIdentity\n',
                  'from .identity_models import TeamIdentity\nfrom .models import TeamEvent\n',
              )

          marker = '    def test_admin_identity_list_redirects_to_singleton_change_form(self):\n'
          methods = '''    def test_safe_attributes_are_translated_but_input_values_are_preserved(self):
        html = (
            '<input placeholder="Name, Position oder Nummer" value="Spielvorbereitung">'
            '<a aria-label="Nächster Monat" title="Termin bearbeiten">Weiter</a>'
        )
        translated = translate_html_content(html, "fa")

        self.assertIn('placeholder="نام، پست یا شماره"', translated)
        self.assertIn('aria-label="ماه بعد"', translated)
        self.assertIn('title="ویرایش رویداد"', translated)
        self.assertIn('value="Spielvorbereitung"', translated)

    def test_persian_event_edit_is_fully_localized(self):
        identity = TeamIdentity.load()
        identity.language = TeamIdentity.Language.PERSIAN
        identity.direction = TeamIdentity.Direction.RTL
        identity.save()
        event = TeamEvent.objects.create(
            title="Spielvorbereitung",
            event_type="meeting",
            starts_at=timezone.now(),
            location="Besprechungsraum 2",
            created_by=self.user,
        )
        call_command("localize_demo_data", verbosity=0)
        event.refresh_from_db()

        response = self.client.get(reverse("event_edit", args=[event.pk]))

        for phrase in (
            'lang="fa"',
            'dir="rtl"',
            "ویرایش رویداد",
            "فقط اطلاعاتی را ثبت کن که مربی واقعاً به آن‌ها نیاز دارد.",
            "نوع رویداد",
            "عنوان",
            "شروع",
            "پایان",
            "مکان",
            "یادداشت‌ها",
            "ذخیره تغییرات",
            "انصراف",
            "جلسه",
            'value="آمادگی پیش از بازی"',
            'value="اتاق جلسه ۲"',
        ):
            self.assertContains(response, phrase)
        for phrase in (
            "Termin bearbeiten",
            "Nur die Informationen, die der Trainer später wirklich braucht.",
            "Änderungen speichern",
            "Abbrechen",
        ):
            self.assertNotContains(response, phrase)

    def test_main_persian_pages_use_localized_interface_copy(self):
        identity = TeamIdentity.load()
        identity.language = TeamIdentity.Language.PERSIAN
        identity.direction = TeamIdentity.Direction.RTL
        identity.save()

        expectations = {
            "dashboard": "روزهای آینده",
            "calendar": "تقویم داخلی",
            "players": "فهرست بازیکنان",
            "trainings": "برنامه‌ریزی تمرین",
            "matches": "بازی را ثبت کن؛ عملکرد بازیکنان را بهتر بفهم.",
            "report": "محرمانه · فقط استفاده داخلی",
        }
        for route, phrase in expectations.items():
            response = self.client.get(reverse(route))
            self.assertEqual(response.status_code, 200)
            self.assertContains(response, phrase)

'''
          if 'test_persian_event_edit_is_fully_localized' not in text:
              text = text.replace(marker, methods + marker)
          tests.write_text(text)
          PY

      - name: Validate Django application
        shell: bash
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,team.smarbiz.sbs
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python manage.py makemigrations --check
          python manage.py check
          python manage.py test
          python manage.py collectstatic --noinput

      - name: Commit localization changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/branding.py core/test_branding.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Complete Persian interface localization'
            git push origin main
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            cd /opt/theteam
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env
            docker compose up -d --build --remove-orphans
            docker image prune -f
            for attempt in $(seq 1 40); do
              if docker compose exec -T web curl -fsS http://127.0.0.1:8000/health/ >/dev/null; then
                docker compose ps
                exit 0
              fi
              sleep 5
            done
            docker compose logs --tail=250
            exit 1

      - name: Verify public Persian page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 20 https://team.smarbiz.sbs/health/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Persian localization workflow finished with **${{ job.status }}**. Run ID: \`${context.runId}\`.`,
            });
