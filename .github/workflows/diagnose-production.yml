name: Diagnose production 500

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == 'Diagnose production 500'
    runs-on: ubuntu-latest
    steps:
      - name: Collect production logs
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          sshpass -p "$PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@"$HOST" \
            'cd /opt/theteam && {
              echo "=== TIMESTAMP ===";
              date -Is;
              echo "=== CONTAINERS ===";
              docker compose ps;
              echo "=== WEB LOGS ===";
              docker compose logs --since=45m --tail=700 web;
              echo "=== CADDY LOGS ===";
              docker compose logs --since=45m --tail=300 caddy;
              echo "=== MEDIA STATE ===";
              docker compose exec -T web sh -lc "find /app/media -maxdepth 3 -type f -printf \"%p %s bytes\\n\" 2>/dev/null | tail -50";
            }' > production-diagnostic.log 2>&1

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-500-diagnostic
          path: production-diagnostic.log
          retention-days: 1

      - name: Publish run reference
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Production diagnostic captured. Run ID: \`${runId}\`.`,
            });
